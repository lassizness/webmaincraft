name: PHP lint

on:
  push:
    branches:
      - master
      - "fix/**"
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: |
          find backend common console frontend \
            -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l
