# Replace hostname before enabling. The frontend and admin panel share one
# origin so the portal session is reused at /admin without a second login.
# This file intentionally does not touch the existing Gravit/LaunchServer
# virtual host on mc-edge.
server {
    listen 80;
    server_name hivetech.example;

    root /opt/hivetech/portal/frontend/web;
    index index.php;
    client_max_body_size 6m;

    location = /admin {
        return 302 /admin/;
    }

    # Backend assets keep their own web root, but are published under the
    # same public /admin prefix.
    location ^~ /admin/css/ {
        alias /opt/hivetech/portal/backend/web/css/;
        expires 7d;
        access_log off;
    }

    location ^~ /admin/assets/ {
        alias /opt/hivetech/portal/backend/web/assets/;
        expires 7d;
        access_log off;
    }

    # All non-static admin routes are handled by the backend Yii entrypoint.
    # SCRIPT_NAME/baseUrl keep generated backend URLs under /admin.
    location ^~ /admin/ {
        include /etc/nginx/fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /opt/hivetech/portal/backend/web/index.php;
        fastcgi_param SCRIPT_NAME /admin/index.php;
        fastcgi_param PHP_SELF /admin/index.php;
        fastcgi_param DOCUMENT_ROOT /opt/hivetech/portal/backend/web;

        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_pass unix:/run/php/php8.3-fpm-hivetech.sock;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.3-fpm-hivetech.sock;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
