# Replace hostnames before enabling. This file intentionally does not touch the
# existing Gravit/LaunchServer virtual host on mc-edge.
server {
    listen 80;
    server_name hivetech.example;
    root /opt/hivetech/portal/frontend/web;
    index index.php;
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm-hivetech.sock;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 7d; access_log off; }
}

server {
    listen 80;
    server_name admin.hivetech.example;
    root /opt/hivetech/portal/backend/web;
    index index.php;
    client_max_body_size 6m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm-hivetech.sock;
    }

    location ~ /\. { deny all; }
    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 7d; access_log off; }
}
